<!DOCTYPE html>
<html>
<head>
    <title>Регистрация</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/theme.css">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100">
<div class="position-absolute top-0 start-0 m-4">
    <a class="brand-link" href="/">DocsTogether</a>
</div>
<div class="card p-4 auth-card">
    <h3 class="text-center mb-4">Регистрация</h3>

    <div id="error-msg" class="alert alert-danger d-none"></div>

    <form id="regForm">
        <div class="mb-3">
            <label>Придумайте логин</label>
            <input type="text" id="username" class="form-control" required>
        </div>
        <div class="mb-3">
            <label>Придумайте пароль</label>
            <input type="password" id="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-success w-100">Создать аккаунт</button>
    </form>

    <div class="mt-3 text-center">
        <a href="/login">Уже есть аккаунт? Войти</a>
    </div>
</div>

<script>
    document.getElementById('regForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;

        try {
            const response = await fetch('/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            if (response.ok) {
                window.location.href = '/login'; // Успех -> на логин
            } else {
                const error = await response.text(); // Или json, если контроллер возвращает json ошибки
                document.getElementById('error-msg').innerText = "Ошибка регистрации (возможно, имя занято)";
                document.getElementById('error-msg').classList.remove('d-none');
            }
        } catch (err) {
            console.error(err);
        }
    });
</script>
</body>
</html>
