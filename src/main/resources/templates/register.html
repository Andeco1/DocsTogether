<!DOCTYPE html>
<html>
<head>
    <title>Регистрация — DocsTogether</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/theme.css">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100">

<div class="card auth-card p-5 border-0">
    <div class="text-center mb-4">
        <div class="d-inline-flex align-items-center justify-content-center bg-primary-50 text-primary rounded-circle mb-3" style="width: 50px; height: 50px;">
            <i class="bi bi-person-plus-fill fs-4"></i>
        </div>
        <h3 class="fw-bold">Создать аккаунт</h3>
        <p class="text-muted small">Присоединяйтесь к DocsTogether бесплатно</p>
    </div>

    <div id="error-msg" class="alert alert-danger d-none py-2 text-center small border-0 bg-danger-subtle text-danger"></div>

    <form id="regForm" autocomplete="off">
        <div class="mb-3">
            <label class="form-label small fw-bold text-muted text-uppercase">Придумайте логин</label>
            <input type="text" id="username" class="form-control" placeholder="Например: alex_design" required autocomplete="off">
        </div>
        <div class="mb-4">
            <label class="form-label small fw-bold text-muted text-uppercase">Придумайте пароль</label>
            <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="new-password">
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2">Зарегистрироваться</button>
    </form>

    <div class="mt-4 text-center">
        <span class="text-muted small">Уже есть аккаунт?</span>
        <a href="/login" class="text-decoration-none fw-bold ms-1">Войти</a>
    </div>
</div>

<script>
    document.getElementById('regForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;

        try {
            const response = await fetch('/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            if (response.ok) {
                window.location.href = '/login';
            } else {
                document.getElementById('error-msg').innerText = "Ошибка: возможно, имя уже занято";
                document.getElementById('error-msg').classList.remove('d-none');
            }
        } catch (err) {
            console.error(err);
        }
    });
</script>
</body>
</html>
