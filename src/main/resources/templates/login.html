<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Вход — DocsTogether</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/theme.css">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100">

<div class="card auth-card p-5 border-0">
  <div class="text-center mb-4">
    <div class="d-inline-flex align-items-center justify-content-center bg-primary-50 text-primary rounded-circle mb-3" style="width: 50px; height: 50px;">
      <i class="bi bi-person-fill fs-4"></i>
    </div>
    <h3 class="fw-bold">С возвращением</h3>
    <p class="text-muted small">Введите данные для входа в DocsTogether</p>
  </div>

  <div th:if="${param.error}" class="alert alert-danger py-2 text-center small border-0 bg-danger-subtle text-danger">
    Неверный логин или пароль
  </div>

  <form action="/perform_login" method="post">
    <div class="mb-3">
      <label class="form-label small fw-bold text-muted text-uppercase">Имя пользователя</label>
      <input type="text" name="username" class="form-control" placeholder="user123" required>
    </div>
    <div class="mb-4">
      <label class="form-label small fw-bold text-muted text-uppercase">Пароль</label>
      <input type="password" name="password" class="form-control" placeholder="••••••" required>
    </div>
    <button type="submit" class="btn btn-primary w-100 py-2">Войти в аккаунт</button>
  </form>

  <div class="mt-4 text-center">
    <span class="text-muted small">Нет аккаунта?</span>
    <a href="/register" class="text-decoration-none fw-bold ms-1">Создать</a>
  </div>
</div>
</body>
</html>
