<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Совместный Редактор (MVP)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>

    <style>
        body { padding: 20px; background-color: #f8f9fa; }
        #editor-container { display: none; margin-top: 20px; }
        textarea { width: 100%; height: 400px; padding: 10px; border: 1px solid #ced4da; border-radius: 5px; font-family: monospace; }
        .status-dot { height: 10px; width: 10px; background-color: #bbb; border-radius: 50%; display: inline-block; margin-right: 5px; }
        .connected { background-color: #28a745; }
    </style>
</head>
<body>

<div class="container">
    <h1 class="mb-4">📝Editor</h1>

    <div class="row mb-4">
        <div class="col-md-6">
            <div class="input-group">
                <input type="text" id="newDocTitle" class="form-control" placeholder="Название документа">
                <button class="btn btn-primary" onclick="createDocument()">Создать</button>
            </div>
        </div>
    </div>

    <div class="card mb-4">
        <div class="card-header">Доступные документы</div>
        <ul class="list-group list-group-flush" id="docList">
        </ul>
    </div>

    <div id="editor-container">
        <h3>
            <span id="status" class="status-dot"></span>
            Редактируем: <span id="currentDocTitle"></span>
        </h3>
        <textarea id="editor" placeholder="Начинайте печатать..."></textarea>
        <div class="text-muted small mt-1">ID: <span id="currentDocId"></span></div>
    </div>
</div>

<script>
    let stompClient = null;
    let currentDocId = null;
    let currentSubscription = null;

    // 1. При загрузке получаем список
    document.addEventListener("DOMContentLoaded", fetchDocuments);

    async function fetchDocuments() {
        try {
            const response = await fetch('/api/documents');
            const docs = await response.json();
            const list = document.getElementById('docList');
            list.innerHTML = '';
            docs.forEach(doc => {
                const li = document.createElement('li');
                li.className = 'list-group-item list-group-item-action';
                li.textContent = doc.title;
                li.onclick = () => openDocument(doc.id, doc.title, doc.content);
                li.style.cursor = 'pointer';
                list.appendChild(li);
            });
        } catch (e) {
            console.error("Ошибка загрузки списка:", e);
        }
    }

    // 2. Создание
    async function createDocument() {
        const title = document.getElementById('newDocTitle').value;
        if (!title) return alert("Введите название");

        await fetch('/api/documents', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({title: title})
        });

        document.getElementById('newDocTitle').value = '';
        fetchDocuments();
    }

    // 3. Открытие документа
    function openDocument(id, title, initialContent) {
        console.log("Открываем документ:", id); // Лог для отладки
        currentDocId = id;

        document.getElementById('editor-container').style.display = 'block';
        document.getElementById('currentDocTitle').innerText = title;
        document.getElementById('currentDocId').innerText = id;

        const textArea = document.getElementById('editor');
        textArea.value = initialContent || '';

        // Подключаемся к сокетам
        connectWebSocket(id);
    }

    // 4. Логика WebSocket
    function connectWebSocket(docId) {
        // Если уже есть клиент и он подключен
        if (stompClient && stompClient.connected) {
            subscribeToTopic(docId); // Просто меняем подписку
            return;
        }

        const socket = new SockJS('/ws');
        stompClient = Stomp.over(socket);
        stompClient.debug = null; // Убираем лишний шум в консоли

        stompClient.connect({}, function (frame) {
            console.log('Connected: ' + frame);
            document.getElementById('status').classList.add('connected');
            subscribeToTopic(docId);
        }, function(error) {
            console.error("Ошибка WebSocket:", error);
            document.getElementById('status').classList.remove('connected');
        });
    }

    function subscribeToTopic(docId) {
        // Если была подписка на другой документ - отписываемся
        if (currentSubscription) {
            currentSubscription.unsubscribe();
        }

        console.log("Подписываемся на: /topic/document/" + docId);

        // ВАЖНО: сохраняем подписку в переменную
        currentSubscription = stompClient.subscribe('/topic/document/' + docId, function (message) {
            console.log("Получено сообщение:", message.body);
            const body = JSON.parse(message.body);
            const textArea = document.getElementById('editor');

            // Защита от затирания: обновляем, только если текст реально другой
            if (textArea.value !== body.newContent) {
                const cursorPos = textArea.selectionStart;
                textArea.value = body.newContent;
                // Пытаемся сохранить позицию курсора (хотя при сильных изменениях он может скакнуть)
                try { textArea.setSelectionRange(cursorPos, cursorPos); } catch(e){}
            }
        });
    }

    // 5. Отправка изменений
    document.getElementById('editor').addEventListener('input', function() {
        if (!stompClient || !stompClient.connected || !currentDocId) {
            console.warn("Нет соединения или документ не выбран");
            return;
        }

        const content = this.value;
        // Отправка сообщения на сервер
        stompClient.send("/app/document.edit/" + currentDocId, {}, JSON.stringify({'newContent': content}));
    });
</script>
</body>
</html>
