<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мои документы</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <link rel="stylesheet" href="/css/theme.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/documents">DocsTogether</a>
        <div class="d-flex gap-2">
            <a class="btn btn-outline-secondary" href="/profile">Профиль</a>
            <a class="btn btn-outline-danger" href="/logout">Выйти</a>
        </div>
    </div>
</nav>
<div class="container py-4">
    <div class="d-flex flex-wrap align-items-center mb-4 toolbar">
        <div class="d-flex flex-column">
            <div class="text-muted small">Текущий пользователь</div>
            <div id="currentUser" class="fw-semibold">...</div>
        </div>
        <div class="ms-auto d-flex flex-wrap gap-2">
            <input type="text" id="search" class="form-control input-grow" placeholder="Поиск по названию">
            <button class="btn btn-outline-primary" onclick="loadDocs()">Искать</button>
        </div>
        <div class="d-flex flex-wrap gap-2">
            <input type="text" id="newTitle" class="form-control input-grow" placeholder="Название нового документа">
            <button class="btn btn-primary" onclick="createDoc()">Создать</button>
        </div>
    </div>

    <div class="row">
        <div class="col-lg-5 mb-4">
            <div class="card shadow-sm">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <span>Мои документы</span>
                    <span class="badge bg-secondary" id="docCount">0</span>
                </div>
                <ul class="list-group list-group-flush" id="docList"></ul>
            </div>
        </div>
        <div class="col-lg-7">
            <div class="card shadow-sm">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <div>
                            <div class="text-muted small">Открыт документ</div>
                            <div class="fw-semibold" id="docTitle">Не выбран</div>
                            <div class="text-muted small" id="docMeta"></div>
                        </div>
                        <div class="d-flex gap-2">
                            <select id="shareRole" class="form-select form-select-sm w-auto">
                                <option value="READER">Чтение</option>
                                <option value="WRITER">Редактирование</option>
                            </select>
                            <button class="btn btn-outline-primary btn-sm" onclick="createShare()">Поделиться</button>
                            <button class="btn btn-outline-danger btn-sm" onclick="deleteDoc()">Удалить</button>
                        </div>
                    </div>
                    <div class="mb-2">
                        <div class="text-muted small">Подключенные пользователи</div>
                        <div id="presence" class="d-flex flex-wrap gap-2"></div>
                    </div>
                    <textarea id="editor" class="form-control" rows="14" placeholder="Выберите документ, чтобы начать" disabled></textarea>
                    <div class="text-muted small mt-2" id="editStatus"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="shareModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Ссылка для доступа</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="mb-2 text-muted">Отправьте ссылку коллегам. Роль: <span id="shareRoleText"></span></div>
                <div class="input-group">
                    <input type="text" id="shareLink" class="form-control" readonly>
                    <button class="btn btn-outline-primary" onclick="copyShare()">Копировать</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    let stompClient = null;
    let currentDocId = null;
    let currentRole = null;
    let currentUser = null;
    let currentSubscription = null;
    let presenceSubscription = null;

    document.addEventListener('DOMContentLoaded', async () => {
        await loadUser();
        await loadDocs();
        const params = new URLSearchParams(window.location.search);
        const openId = params.get('open');
        if (openId) {
            openDocById(openId);
        }
    });

    async function loadUser() {
        const res = await fetch('/auth');
        if (res.ok) {
            currentUser = await res.json();
            document.getElementById('currentUser').innerText = currentUser.username;
        }
    }

    async function loadDocs() {
        const q = document.getElementById('search').value;
        const res = await fetch('/api/documents' + (q ? '?q=' + encodeURIComponent(q) : ''));
        const docs = await res.json();
        const list = document.getElementById('docList');
        list.innerHTML = '';
        docs.forEach(doc => {
            const li = document.createElement('li');
            li.className = 'list-group-item d-flex justify-content-between align-items-center';
            li.innerHTML = `<div><div class="fw-semibold">${doc.title}</div><div class="text-muted small">Роль: ${doc.role}</div></div><button class="btn btn-link btn-sm">Открыть</button>`;
            li.querySelector('button').onclick = () => openDoc(doc);
            list.appendChild(li);
        });
        document.getElementById('docCount').innerText = docs.length;
    }

    async function createDoc() {
        const title = document.getElementById('newTitle').value.trim();
        if (!title) return;
        await fetch('/api/documents', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({title})
        });
        document.getElementById('newTitle').value = '';
        loadDocs();
    }

    async function openDoc(doc) {
        const res = await fetch(`/api/documents/${doc.id}`);
        if (!res.ok) return;
        const detailed = await res.json();
        currentDocId = detailed.id;
        currentRole = detailed.role;
        document.getElementById('docTitle').innerText = detailed.title;
        document.getElementById('docMeta').innerText = `Роль: ${detailed.role} • Последнее изменение: ${detailed.lastModified ?? ''}`;
        const editor = document.getElementById('editor');
        editor.value = detailed.content || '';
        editor.disabled = detailed.editable === false;
        document.getElementById('editStatus').innerText = detailed.editable ? 'Вы можете редактировать' : 'Только просмотр';
        await loadMembers(detailed.id);
        connectWebSocket(detailed.id);
    }

    async function openDocById(id) {
        const res = await fetch(`/api/documents/${id}`);
        if (!res.ok) return;
        const doc = await res.json();
        openDoc(doc);
    }

    async function loadMembers(docId) {
        const res = await fetch(`/api/documents/${docId}/members`);
        if (!res.ok) return;
        const members = await res.json();
        const presence = document.getElementById('presence');
        presence.innerHTML = '';
        members.forEach(m => {
            const badge = document.createElement('span');
            badge.className = 'presence-badge';
            badge.innerText = `${m.username} (${m.role})`;
            presence.appendChild(badge);
        });
    }

    function connectWebSocket(docId) {
        if (stompClient && stompClient.connected) {
            subscribeToDoc(docId);
            return;
        }
        const socket = new SockJS('/ws');
        stompClient = Stomp.over(socket);
        stompClient.debug = null;
        stompClient.connect({}, () => {
            subscribeToDoc(docId);
        });
    }

    function subscribeToDoc(docId) {
        if (currentSubscription) currentSubscription.unsubscribe();
        if (presenceSubscription) presenceSubscription.unsubscribe();

        currentSubscription = stompClient.subscribe(`/topic/document/${docId}`, message => {
            const body = JSON.parse(message.body);
            const editor = document.getElementById('editor');
            if (editor.value !== body.newContent) {
                const pos = editor.selectionStart;
                editor.value = body.newContent;
                try { editor.setSelectionRange(pos, pos); } catch(e){}
            }
        });

        presenceSubscription = stompClient.subscribe(`/topic/document/${docId}/presence`, message => {
            const data = JSON.parse(message.body);
            updatePresenceBadge(data);
        });

        sendPresence('join');
    }

    function sendPresence(type) {
        if (!stompClient || !stompClient.connected || !currentDocId) return;
        stompClient.send(`/app/document.presence/${currentDocId}`, {}, JSON.stringify({type}));
    }

    function updatePresenceBadge(update) {
        const presence = document.getElementById('presence');
        const existing = presence.querySelector(`[data-user='${update.userId}']`);
        if (update.type === 'leave') {
            if (existing) existing.remove();
            return;
        }
        const badge = existing || document.createElement('span');
        badge.dataset.user = update.userId;
        badge.className = 'presence-badge';
        badge.innerText = `${update.username} (${update.role})`;
        if (!existing) presence.appendChild(badge);
    }

    document.getElementById('editor').addEventListener('input', function() {
        if (!stompClient || !stompClient.connected || !currentDocId) return;
        if (currentRole === 'READER') return;
        stompClient.send(`/app/document.edit/${currentDocId}`, {}, JSON.stringify({newContent: this.value}));
    });

    async function deleteDoc() {
        if (!currentDocId) return;
        if (!confirm('Удалить документ?')) return;
        await fetch(`/api/documents/${currentDocId}`, {method: 'DELETE'});
        currentDocId = null;
        document.getElementById('editor').value = '';
        document.getElementById('docTitle').innerText = 'Не выбран';
        document.getElementById('docMeta').innerText = '';
        loadDocs();
    }

    async function createShare() {
        if (!currentDocId) return;
        const role = document.getElementById('shareRole').value;
        const res = await fetch(`/api/documents/${currentDocId}/share`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({role})
        });
        if (!res.ok) return;
        const data = await res.json();
        const link = `${window.location.origin}/share/${data.token}`;
        document.getElementById('shareLink').value = link;
        document.getElementById('shareRoleText').innerText = role === 'WRITER' ? 'Редактирование' : 'Чтение';
        new bootstrap.Modal(document.getElementById('shareModal')).show();
    }

    function copyShare() {
        const input = document.getElementById('shareLink');
        input.select();
        document.execCommand('copy');
    }

    window.addEventListener('beforeunload', () => sendPresence('leave'));
</script>
</body>
</html>
